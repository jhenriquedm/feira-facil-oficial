  <body>
    <script>
      // Ignore harmless [vite] WebSocket connection errors per AI Studio environment constraints
      (function() {
        const _origConsoleError = console.error;
        console.error = function(...args) {
          const first = typeof args[0] === 'string' ? args[0] : '';
          const second = typeof args[1] === 'string' ? args[1] : (args[1] ? String(args[1]) : '');
          if (
            (first.includes('[vite]') || first === '[vite]') &&
            (first.toLowerCase().includes('websocket') ||
             second.toLowerCase().includes('websocket') ||
             first.toLowerCase().includes('failed to connect') ||
             second.toLowerCase().includes('failed to connect') ||
             second.toLowerCase().includes('not open') ||
             second.toLowerCase().includes('closed'))
          ) {
            return;
          }
          _origConsoleError.apply(console, args);
        };
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
