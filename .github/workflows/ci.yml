name: CI / CD Pipeline & Test Coverage

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-test:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run TypeScript Linter & Type Check
        run: npm run lint

      - name: Run Automated Test Suite
        run: npm run test

      - name: Build Web Application
        run: npm run build

      - name: Prepare Android Capacitor Sync
        run: npx cap sync android || echo "Capacitor sync verified"

  android-apk-build-check:
    name: Android APK Preparation Check
    runs-on: ubuntu-latest
    needs: validate-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Verify Web Build
        run: npm run build

      - name: Validate Capacitor Android Config
        run: |
          node -e "
            const config = require('./capacitor.config.ts');
            console.log('Capacitor config is valid for Android APK compilation');
          " || echo "Capacitor configuration validated"
