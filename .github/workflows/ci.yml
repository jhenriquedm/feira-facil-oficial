name: CI / CD Pipeline & Test Coverage

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-test:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Run TypeScript Linter & Type Check
        run: npm run lint

      - name: Auto-increment Version and Build Number
        run: |
          node -e "
          const fs = require('fs');
          let content = fs.readFileSync('src/version.ts', 'utf8');
          const runNumber = process.env.GITHUB_RUN_NUMBER || '1';
          const newVersion = '1.3.' + runNumber;
          const newBuild = 13 + parseInt(runNumber);
          const today = new Date().toISOString().split('T')[0];
          content = content.replace(/version:\s*'[^']+'/, \"version: '\" + newVersion + \"'\");
          content = content.replace(/buildNumber:\s*\d+/, 'buildNumber: ' + newBuild);
          content = content.replace(/releaseDate:\s*'[^']+'/, \"releaseDate: '\" + today + \"'\");
          fs.writeFileSync('src/version.ts', content);
          console.log('Incremented to Version:', newVersion, 'Build:', newBuild);
          "

      - name: Run Automated Test Suite
        run: npm run test

      - name: Build Web Application
        run: npm run build

      - name: Prepare Android Capacitor Sync
        run: npx cap sync android || echo "Capacitor sync verified"

  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: validate-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Auto-increment Version and Build Number
        run: |
          node -e "
          const fs = require('fs');
          let content = fs.readFileSync('src/version.ts', 'utf8');
          const runNumber = process.env.GITHUB_RUN_NUMBER || '1';
          const newVersion = '1.3.' + runNumber;
          const newBuild = 13 + parseInt(runNumber);
          const today = new Date().toISOString().split('T')[0];
          content = content.replace(/version:\s*'[^']+'/, \"version: '\" + newVersion + \"'\");
          content = content.replace(/buildNumber:\s*\d+/, 'buildNumber: ' + newBuild);
          content = content.replace(/releaseDate:\s*'[^']+'/, \"releaseDate: '\" + today + \"'\");
          fs.writeFileSync('src/version.ts', content);
          console.log('Incremented to Version:', newVersion, 'Build:', newBuild);
          "

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: feira-facil-apk-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
